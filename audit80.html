<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Previa 8.0 · Pruebas de navegador</title>
<style>body{background:#102337;color:white;font:14px system-ui;margin:12px}button{padding:12px;margin:4px;cursor:pointer}iframe{width:960px;max-width:100%;height:740px;border:2px solid #71c9bd;background:#172f34}pre{white-space:pre-wrap}#report{max-height:350px;overflow:auto}</style>
<h1>La Previa 8.0 · Revisión jugable</h1><p>Pruebas sobre una partida de ensayo. No uses esta página para tu partida personal.</p>
<button id="run">Ejecutar pruebas de navegador</button><button id="mobile">Móvil 390 × 844</button><button id="landscape">Móvil 844 × 390</button><button id="desktop">Escritorio</button><button id="diary">Diario</button><button id="battle">Combate real</button><button id="native">Mewtwo</button><button id="burger">Burger</button><button id="full">Pantalla completa</button><button id="download">Descargar resultados</button>
<pre id="report">Cargando el motor…</pre><iframe id="game" src="/?qa=1" allow="fullscreen" allowfullscreen></iframe>
<script>
const frame=document.getElementById('game'),out=document.getElementById('report');let report={checks:[],errors:[]};
const wait=ms=>new Promise(r=>setTimeout(r,ms));const w=()=>frame.contentWindow;const qa=()=>w().__PREVIA_QA;const check=(name,ok,detail)=>{report.checks.push({name,ok:!!ok,detail});out.textContent=JSON.stringify(report,null,2)};
frame.onload=()=>{w().addEventListener('error',e=>{report.errors.push(e.message);out.textContent=JSON.stringify(report,null,2)});out.textContent='Motor cargado. Listo para probar.'};
function fixture(){qa().dev600.select('646_lab');qa().visit('benifaio');const st=qa().getState();st.badges=[];st.flags.starter=true;st.party=[qa().createMon('Charizard',50)];for(let i=0;i<8;i++)st.flags['cine661_badge_'+i]=true;qa().setState(JSON.parse(JSON.stringify(qa().serializeState())));qa().save();return qa().getState();}
function click(sel){const b=w().document.querySelector(sel);if(!b)throw Error('No existe '+sel);b.click()}
document.getElementById('run').onclick=async()=>{report={checks:[],errors:[],userAgent:navigator.userAgent,viewport:[innerWidth,innerHeight]};try{
check('14 módulos de expansión cargados',!!w().__PREVIA80&&!!w().__PREVIA_78&&!!w().__PREVIA_76&&!!w().__PREVIA70&&!!w().__PREVIA70_CHAOS);
const paths=[...['marshall','horte','plata','awelo','sergio','alfaro','nachito','javi_grau','blas','laboratorio_fondo'].map(n=>'assets/seleccion73/'+n+'.png'),...['awelo','blas','festivern','mewtwo','patri'].map(n=>'assets/cinematicas72/'+n+'.png'),...['awelo','robert','mewtwo','hero'].flatMap(n=>['normal','espejo','espectral','gigante','404'].map(v=>'assets/dimension404/'+n+'_'+v+'.png'))];
await Promise.all(paths.map(async path=>{const image=new Image();image.src=path;try{await image.decode();check('Recurso '+path,image.naturalWidth>0)}catch(e){check('Recurso '+path,false)}}));
let st=fixture();const original=JSON.parse(JSON.stringify(qa().serializeState()));delete original.flags.reliquias70;delete original.flags.caos70;original.edition='6.62';check('Guardado anterior v:1 válido',qa().validSave(original));check('Importar partida anterior',qa().setState(original));st=qa().getState();qa().save();check('Nuevo guardado con reliquias y caos válido',qa().validSave(qa().serializeState()));const snap=JSON.parse(JSON.stringify(qa().serializeState()));check('Recarga conserva equipo, medallas y banderas',qa().setState(snap)&&JSON.stringify(qa().serializeState().flags)===JSON.stringify(snap.flags));
qa().openStart29();check('START tiene diario y Extras',!!w().document.querySelector('[data-v80]')&&!!w().document.querySelector('#startExtras662'));w().__PREVIA80.open();check('Diario pausa el mundo',qa().getState().screen==='diary80');w().__PREVIA80.close();
for(const q of qa().clues80()){qa().visit(q.scene);check('Pista en mapa '+q.id,!!q.point);if(!q.point)continue;check('Pista sin colisión '+q.id,!qa().collision(q.point.x,q.point.y));qa().landmarkTalk(q.point);qa().finishDialog();st=qa().getState();check('Pista registrada '+q.id,st.flags['v80_found_'+q.id]);w().__PREVIA80.open();const row=[...w().document.querySelectorAll('#previa80 .v80-item')].find(e=>e.textContent.includes(q.id==='benifaio'?'El recado de Marshall':q.id==='silla'?'La factura de Team Cierre':q.id==='albal'?'El pedido imposible':q.id==='sueca'?'El milagro del 5 %':q.id==='festivern'?'La pista de cristal':'El bingo imposible'));const money=st.money;row.querySelector('button').click();const after=st.money;check('Premio '+q.id,after>money);row.querySelector('button').click();check('Premio único '+q.id,st.money===after);w().__PREVIA80.close();}
// Exercise the Sergio variant which used to miss the warehouse pass.
st=fixture();st.badges=[0,1];st.flags.op625_step=2;qa().visit('gym_sergio');qa().npcTalk({id:'gym_sergio',who:'sergio'});qa().finishDialog();check('Sergio entrega pase desde pabellón',qa().getState().flags.op625_step===3);
for(const id of w().__PREVIA_78.characters){qa().title64StartNew(id);qa().intro67End();check('Introducción '+id,!!w().document.querySelector('.trainer78'));w().document.querySelector('.trainer78 [data-skip]')?.click();check('Introducción devuelve control '+id,qa().getState().screen==='world');}
for(const mon of ['Bulbasaur','Charmander','Squirtle']){fixture();st=qa().getState();st.flags.starter=false;st.party=[];qa().starterModal();click('[data-starter="'+mon+'"]');click('.title73-confirm .yes');check('Animación de inicial '+mon,!!w().document.querySelector('.starter74-layer'));click('.starter74-skip');check('Inicial elegido '+mon,qa().getState().party[0]?.name===mon&&qa().getState().flags.starter);qa().finishDialog();await wait(300);w().document.querySelector('.borxeta75 [data-skip]')?.click();}
fixture();for(const id of qa().nativeScenes()){qa().visit('burger');qa().playNative(id);await wait(450);check('Cinemática nativa dibujada '+id,!!w().document.querySelector('.scene661 canvas[data-seconds]')&&!w().document.querySelector('.scene661 canvas[data-fallback]'));const next=[...w().document.querySelectorAll('.scene661 button')].at(-1);next?.click();check('Cinemática devuelve control '+id,qa().getState().screen==='world');}
fixture();qa().visit('burger');qa().rescue();check('Recuperación sin colisión',!qa().collision(qa().getState().player.x,qa().getState().player.y));

fixture();st=qa().getState();st.flags.v80_dim_imported=true;st.flags.v80_dim_echoes=0;st.flags.v80_dim_won=false;for(const k of ['3_6','16_2','11_10'])st.flags['v80_dim_'+k]=false;
w().localStorage.setItem('la-previa-706-archivo',JSON.stringify({first:{piedra:'test'}}));w().__PREVIA707.open();check('Dimensión pausa el mundo',qa().getState().screen==='dimension80');
const grid=["####################", "#....#.......#.....#", "#....#.......#..F..#", "#............#.....#", "#..N...............#", "#........##........#", "#..F.....##........#", "#........##...N....#", "#..............#...#", "#.....#........#...#", "#.....#....F.......#", "#.E..............R.#", "####################"];let pos=[2,11];function walk(goal){const key=p=>p.join(','),queue=[[pos,[]]],seen=new Set([key(pos)]);while(queue.length){const [p,path]=queue.shift();if(key(p)===key(goal)){for(const step of path)click('#p707 [data-step="'+step.join(',')+'"]');pos=goal;return true;}for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){const n=[p[0]+d[0],p[1]+d[1]];if(grid[n[1]]?.[n[0]]!=='#'&&grid[n[1]]?.[n[0]]&&!seen.has(key(n))){seen.add(key(n));queue.push([n,[...path,d]])}}}return false;}
walk([14,7]);check('Robert primero solo cuenta un eco',w().__PREVIA707.progress().echoes===1);walk([3,4]);check('Los dos ecos cuentan por separado',w().__PREVIA707.progress().echoes===2);
for(const goal of [[3,6],[16,2],[11,10]])walk(goal);check('Tres fragmentos recogidos',w().__PREVIA707.progress().found===3);walk([17,11]);click('#p707-act');click('#p707-act');check('Final de Dimensión 404',w().__PREVIA707.progress().won);w().__PREVIA707.close();const dim=JSON.parse(JSON.stringify(qa().serializeState()));check('Dimensión incluida en guardado válido',qa().validSave(dim)&&dim.flags.v80_dim_won);qa().setState(dim);check('Dimensión conservada al cargar partida',w().__PREVIA707.progress().won);w().__PREVIA80.open();const bonus=[...w().document.querySelectorAll('#previa80 .v80-item')].find(e=>e.textContent.includes('El eco estabilizado'));const before=qa().getState().money;bonus.querySelector('button').click();check('Epílogo entrega 404 monedas',qa().getState().money===before+404);bonus.querySelector('button').click();check('Epílogo no duplica premio',qa().getState().money===before+404);w().__PREVIA80.close();

check('Sin excepciones capturadas',report.errors.length===0);report.finished=new Date().toISOString();report.pass=report.checks.every(c=>c.ok)&&!report.errors.length;
}catch(e){report.errors.push(e.stack||String(e));report.pass=false}out.textContent=JSON.stringify(report,null,2)};
document.getElementById('mobile').onclick=()=>{frame.style.width='390px';frame.style.height='844px'};
document.getElementById('landscape').onclick=()=>{frame.style.width='844px';frame.style.height='390px'};
document.getElementById('desktop').onclick=()=>{frame.style.width='960px';frame.style.height='740px'};
document.getElementById('diary').onclick=()=>{fixture();w().__PREVIA80.open()};
document.getElementById('battle').onclick=()=>{fixture();qa().startBattle('Squirtle',15,false,'v80:borxeta:silla');qa().finishEntry()};
document.getElementById('native').onclick=()=>{fixture();qa().playNative('capsule')};
document.getElementById('burger').onclick=()=>{fixture();qa().visit('burger')};
document.getElementById('full').onclick=()=>frame.requestFullscreen();
document.getElementById('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.download='La_Previa_8_0_Pruebas_Navegador.json';a.click()};
</script>
